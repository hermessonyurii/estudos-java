spring.application.name=crud

# Importa configuracoes locais se existirem (ignorado no git)
spring.config.import=optional:application-local.properties

# Configuracoes de conexao com PostgreSQL (com suporte a variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product-api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sua_senha_aqui}
